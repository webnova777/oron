<!--
  ORON · 스크롤 히어로 (아임웹 코드 위젯 삽입용)
  - html / head / body 없이 HTML + CSS + JavaScript 만 사용합니다. (외부 라이브러리·폰트 없음)
  - 스크롤을 내리면 캔버스에 프레임 이미지가 이어서 그려지고(스크럽), 문구가 하나씩 나타납니다.
  - 위로 올리면 영상이 거꾸로 재생되고 문구도 거꾸로 사라집니다.
  - 아래 스크립트 맨 위의 ORON_HERO_CONFIG(DEFAULTS) 에서 프레임 주소와 개수를 바꿀 수 있습니다.
  - 사용 위치: 아임웹 "전체 폭 · 여백 0" 섹션 안의 코드 위젯
-->
<style>
  /* ================================================================
     ORON 히어로 · 모든 클래스/아이디는 oron- 접두사로 충돌을 막습니다
     ================================================================ */

  /* 전체 영역: 높이가 곧 "스크롤 길이" (600vh = 화면 6개 분량) */
  #oron-hero {
    --oron-bg: #FBFAF8;                 /* 배경(오프화이트) */
    --oron-ink: #363636;                /* 글자(소프트 차콜) */
    --oron-dark: #15181E;               /* 버튼 */
    --oron-grad: linear-gradient(90deg, #8FE3B0 0%, #F3E58A 52%, #F5A9C8 100%); /* 로고 그라데이션 */
    position: relative;
    width: 100%;
    height: 600vh;
    background: var(--oron-bg);
    color: var(--oron-ink);
  }

  /* 화면에 고정되는 무대 (스크롤 위치에 따라 JS가 클래스를 바꿈) */
  #oron-hero .oron-stage {
    position: absolute; top: 0; left: 0; right: 0;
    height: 100vh; height: 100svh;
    overflow: hidden;
    background: var(--oron-bg);
  }
  #oron-hero .oron-stage.oron-is-pinned { position: fixed; top: 0; bottom: auto; }   /* 히어로 구간: 화면에 고정 */
  #oron-hero .oron-stage.oron-is-after  { position: absolute; top: auto; bottom: 0; } /* 히어로 이후: 구간 끝에 붙음 */

  /* 영상 프레임이 그려지는 캔버스 */
  #oron-hero .oron-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

  /* ---------- 문구 영역 ---------- */
  #oron-hero .oron-copy {
    position: absolute; z-index: 2;
    left: clamp(24px, 6vw, 112px);
    top: 40%; transform: translateY(-50%);   /* 영상 끝의 낱개 포장이 아래쪽에 놓이므로 문구는 위쪽에 */
    width: 48vw;
    text-align: left;
  }
  #oron-hero .oron-sub {            /* 소개 문장 */
    font-size: clamp(14px, 1.45vw, 22px);
    font-weight: 500; letter-spacing: -.01em; line-height: 1.5;
  }
  #oron-hero .oron-title {          /* GOOD PRODUCTS. / NEW MARKET. */
    margin: 14px 0 28px;
  }
  #oron-hero .oron-title-line {
    font-size: clamp(30px, 4.2vw, 72px);
    font-weight: 800; letter-spacing: -.025em; line-height: 1.06;
  }

  /* 하나씩 등장: 처음엔 숨김 → oron-is-in 이 붙으면 나타남 */
  #oron-hero .oron-step {
    opacity: 0; transform: translate3d(0, 28px, 0);
    transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1);
    will-change: opacity, transform;
  }
  #oron-hero .oron-step.oron-is-in { opacity: 1; transform: translate3d(0, 0, 0); }

  /* NEW MARKET. 아래의 로고 그라데이션 라인 */
  #oron-hero .oron-accent { position: relative; display: inline-block; padding-bottom: 12px; }
  #oron-hero .oron-accent::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 6px; width: 100%;
    background: var(--oron-grad); border-radius: 3px;
    transform: scaleX(0); transform-origin: left center;
    transition: transform .9s cubic-bezier(.2,.7,.2,1) .25s;
  }
  #oron-hero .oron-accent.oron-is-in::after { transform: scaleX(1); }

  /* CONTACT 버튼 */
  #oron-hero .oron-btn {
    display: inline-block; position: relative;
    padding: 16px 36px; border-radius: 4px;
    background: var(--oron-dark); color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: .08em; text-decoration: none;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  #oron-hero .oron-btn::after {            /* 버튼 아래 그라데이션 포인트 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    border-radius: 0 0 4px 4px; background: var(--oron-grad);
  }
  #oron-hero .oron-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(21,24,30,.18); }

  /* ---------- 스크롤 안내 / 진행 바 / 로딩 바 ---------- */
  #oron-hero .oron-hint {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 2;
    font-size: 11px; font-weight: 600; line-height: 1; letter-spacing: .3em;
    transition: opacity .4s ease;
  }
  #oron-hero .oron-hint::after {
    content: ""; display: block; width: 1px; height: 34px; margin: 10px auto 0;
    background: var(--oron-ink); opacity: .5; transform-origin: top;
    animation: oron-hero-drip 1.6s ease-in-out infinite;
  }
  @keyframes oron-hero-drip { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

  #oron-hero .oron-progress {          /* 아래쪽 그라데이션 진행 바 */
    position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; z-index: 3;
    background: var(--oron-grad); transform: scaleX(0); transform-origin: left center;
  }
  #oron-hero .oron-loading {           /* 위쪽 프레임 로딩 바 */
    position: absolute; left: 0; top: 0; height: 3px; width: 100%; z-index: 4;
    background: var(--oron-ink); opacity: .35; transform: scaleX(0); transform-origin: left center;
    transition: opacity .4s ease;
  }

  /* ---------- 모바일(세로 화면): 영상은 위쪽, 문구는 아래쪽 ---------- */
  @media (max-width: 820px) {
    #oron-hero .oron-copy { left: 20px; right: 20px; width: auto; top: auto; bottom: 72px; transform: none; text-align: center; }
    #oron-hero .oron-title { margin: 8px 0 18px; }
    #oron-hero .oron-title-line { font-size: clamp(28px, 9vw, 48px); }
    #oron-hero .oron-btn { padding: 14px 30px; }
  }

  /* 사용자가 "동작 줄이기"를 켠 경우: 정지 화면 + 문구 모두 표시 */
  @media (prefers-reduced-motion: reduce) {
    #oron-hero { height: 100svh; }
    #oron-hero .oron-step { opacity: 1; transform: none; transition: none; }
    #oron-hero .oron-accent::after { transform: scaleX(1); transition: none; }
    #oron-hero .oron-hint, #oron-hero .oron-progress { display: none; }
  }
</style>

<!-- ================= 마크업 ================= -->
<div id="oron-hero" aria-label="ORON 소개">
  <div class="oron-stage">
    <canvas class="oron-canvas" aria-hidden="true"></canvas>
    <div class="oron-loading"></div>

    <!-- 문구: 스크롤에 맞춰 위에서부터 하나씩 나타남 (제목 태그 대신 div 사용) -->
    <div class="oron-copy">
      <div class="oron-sub oron-step" id="oron-hero-sub">좋은 제품을 발견하고, 새로운 시장을 만듭니다.</div>

      <div class="oron-title" id="oron-hero-title">
        <div class="oron-title-line oron-step">GOOD PRODUCTS.</div>
        <div class="oron-title-line oron-step"><span class="oron-accent">NEW MARKET.</span></div>
      </div>

      <div class="oron-step" id="oron-hero-btn">
        <a class="oron-btn" href="/#s20260908368a1818aacdd">CONTACT</a>
      </div>
    </div>

    <div class="oron-hint">SCROLL</div>
    <div class="oron-progress"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ===== 설정 (여기만 바꾸면 됩니다) =====
  var DEFAULTS = {
    base: 'https://cdn.jsdelivr.net/gh/webnova777/oron@a7616cc9276b7cfad8ab4b5d01c548cb383d2853/hero-scroll/frames/', // 프레임 이미지 폴더 주소(끝에 / 포함, 커밋 고정)
    count: 301,            // 프레임 총 개수 (0001.webp ~ 0301.webp)
    ext: 'webp',
    videoEnd: 0.64,        // 스크롤 진행도 0~이 값 사이에 영상 재생, 이후는 마지막 프레임 유지
    steps: [0.70, 0.78, 0.86, 0.94], // 문구 등장 시점: 소개문 → GOOD PRODUCTS. → NEW MARKET. → 버튼
    mobileVisible: 0.68,   // 세로 화면에서 영상 가로의 몇 %를 보여줄지 (제품이 있는 가운데 부분)
    mobileFocusX: 0.53,    // 보여줄 부분의 중심 (0=왼쪽 끝, 1=오른쪽 끝)
    mobileCenterY: 0.34    // 영상이 놓일 세로 위치 (0=맨 위, 1=맨 아래)
  };
  var cfg = Object.assign({}, DEFAULTS, window.ORON_HERO_CONFIG || {});

  var root = document.getElementById('oron-hero');
  if (!root || root.__oronInit) return;   // 같은 페이지에 두 번 들어가도 한 번만 실행
  root.__oronInit = true;

  var stage = root.querySelector('.oron-stage');
  var canvas = root.querySelector('.oron-canvas');
  var ctx = canvas.getContext('2d');
  var hint = root.querySelector('.oron-hint');
  var bar = root.querySelector('.oron-progress');
  var loadingBar = root.querySelector('.oron-loading');
  var steps = Array.prototype.slice.call(root.querySelectorAll('.oron-step')); // 등장 순서대로
  var accent = root.querySelector('.oron-accent');

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N = cfg.count;
  var loaded = new Array(N);       // 불러온 프레임 이미지
  var loadedCount = 0;
  var target = 0, current = 0;     // 목표 프레임 / 현재 프레임(부드럽게 따라감)
  var lastDrawn = -1, progress = 0;
  var cw = 0, ch = 0;

  function pad(i) { var s = String(i + 1); while (s.length < 4) s = '0' + s; return s; }
  function ok(img) { return img && img.complete && img.naturalWidth > 0; }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  // ----- 프레임 불러오기: 처음·끝 → 듬성듬성 → 나머지 순서 (빨리 움직여도 끊기지 않게) -----
  function loadOrder() {
    var order = [0, N - 1], seen = {}; seen[0] = seen[N - 1] = 1;
    [12, 4, 1].forEach(function (stride) {
      for (var i = 0; i < N; i += stride) if (!seen[i]) { seen[i] = 1; order.push(i); }
    });
    return order;
  }
  function loadFrames() {
    var order = loadOrder(), pos = 0, active = 0, MAX = 6;   // 동시에 6장씩
    function next() {
      while (active < MAX && pos < order.length) {
        (function (i) {
          active++;
          var img = new Image();
          img.decoding = 'async';
          img.onload = img.onerror = function () {
            if (ok(img)) loaded[i] = img;
            loadedCount++; active--;
            loadingBar.style.transform = 'scaleX(' + (loadedCount / N) + ')';
            if (loadedCount >= N) loadingBar.style.opacity = 0;
            lastDrawn = -1;               // 새로 받은 프레임으로 다시 그리기
            next();
          };
          img.src = cfg.base + pad(i) + '.' + cfg.ext;
        })(order[pos++]);
      }
    }
    next();
  }

  // ----- 캔버스 크기 / 그리기 -----
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = stage.getBoundingClientRect();
    var w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (w !== cw || h !== ch) { cw = canvas.width = w; ch = canvas.height = h; lastDrawn = -1; }
  }
  function draw(idx) {
    var img = loaded[idx];
    if (!ok(img)) {                       // 아직 못 받은 프레임이면 가장 가까운 프레임을 대신 사용
      img = null;
      for (var d = 1; d < N; d++) {
        if (ok(loaded[idx - d])) { img = loaded[idx - d]; break; }
        if (ok(loaded[idx + d])) { img = loaded[idx + d]; break; }
      }
    }
    if (!img) return;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    ctx.fillStyle = '#FBFAF8'; ctx.fillRect(0, 0, cw, ch);

    if (cw < ch) {
      // 세로 화면: 영상 가운데 부분(제품이 있는 곳)을 가로에 맞춰 위쪽에 두고, 문구는 아래에 둡니다.
      var s = cw / (iw * cfg.mobileVisible), dw = iw * s, dh = ih * s;
      var dx = cw / 2 - cfg.mobileFocusX * dw, dy = ch * cfg.mobileCenterY - dh / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
      // 영상 위·아래 경계가 티 나지 않게 배경색으로 부드럽게 덮기
      var fade = dh * 0.16;
      [[dy, dy + fade], [dy + dh, dy + dh - fade]].forEach(function (g) {
        var grad = ctx.createLinearGradient(0, g[0], 0, g[1]);
        grad.addColorStop(0, 'rgba(251,250,248,1)'); grad.addColorStop(1, 'rgba(251,250,248,0)');
        ctx.fillStyle = grad; ctx.fillRect(0, Math.min(g[0], g[1]), cw, fade);
      });
      ctx.fillStyle = '#FBFAF8';
      ctx.fillRect(0, 0, cw, Math.max(0, dy)); ctx.fillRect(0, dy + dh, cw, ch - dy - dh);
      return;
    }
    // 가로 화면: 화면을 가득 채우기(cover)
    var sc = Math.max(cw / iw, ch / ih), w2 = iw * sc, h2 = ih * sc;
    ctx.drawImage(img, (cw - w2) / 2, (ch - h2) / 2, w2, h2);
  }

  // ----- 스크롤 진행도 / 화면 고정(pin) / 문구 등장 -----
  function update() {
    var r = root.getBoundingClientRect();
    var vh = window.innerHeight;
    var range = Math.max(1, r.height - vh);
    progress = clamp(-r.top / range, 0, 1);              // 0(시작) ~ 1(끝)

    var state = r.top > 0 ? 'before' : (r.bottom < vh ? 'after' : 'pinned');
    stage.classList.toggle('oron-is-pinned', state === 'pinned');
    stage.classList.toggle('oron-is-after', state === 'after');

    target = clamp(progress / cfg.videoEnd, 0, 1) * (N - 1);   // 목표 프레임 번호

    // 진행도가 기준을 넘으면 켜고, 되돌아오면 끔 → 역방향도 자연스럽게
    steps.forEach(function (el, i) {
      el.classList.toggle('oron-is-in', progress >= cfg.steps[Math.min(i, cfg.steps.length - 1)]);
    });
    if (accent) accent.classList.toggle('oron-is-in', progress >= cfg.steps[2]);
    hint.style.opacity = progress < 0.03 ? 1 : 0;
    bar.style.transform = 'scaleX(' + progress + ')';
  }

  // ----- 매 프레임: 목표 프레임을 향해 부드럽게 따라가며 그리기 -----
  function tick() {
    current += (target - current) * 0.2;
    if (Math.abs(target - current) < 0.01) current = target;
    var idx = clamp(Math.round(current), 0, N - 1);
    if (idx !== lastDrawn) { draw(idx); lastDrawn = idx; }
    requestAnimationFrame(tick);
  }

  // ----- 시작 -----
  resize();
  window.addEventListener('resize', function () { resize(); update(); });
  loadFrames();

  if (reduce) {            // 동작 줄이기: 마지막 프레임만 보여주고 문구는 모두 표시
    target = current = N - 1;
    steps.forEach(function (el) { el.classList.add('oron-is-in'); });
    var t = setInterval(function () { if (ok(loaded[N - 1])) { lastDrawn = -1; draw(N - 1); clearInterval(t); } }, 120);
    return;
  }

  window.addEventListener('scroll', update, { passive: true });
  // 사이트에 이미 Lenis(부드러운 스크롤)가 있고 window.lenis 로 열려 있으면, 그 스크롤 이벤트에도 연결
  if (window.lenis && typeof window.lenis.on === 'function') window.lenis.on('scroll', update);
  update();
  requestAnimationFrame(tick);
})();
</script>
