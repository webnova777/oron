  ORON · 제품 3개 마스크 리빌 스크롤 히어로 (아임웹 코드 위젯 삽입용)
  - html / head / body 없이 HTML + CSS + JavaScript 만 사용합니다. (외부 라이브러리·폰트 없음)
  - 스크롤을 내리면 색 띠가 펼쳐지고, 띠마다 패키지가 자기 띠의 아래쪽 경계선 밖에서 올라오며 드러나고(아래쪽은 살짝 가려짐), 반대쪽에서 과자 실물이 뿅 하고 나타납니다.
  - 제품이 다 나타나면 바탕에 어두운 오버레이가 깔리고, 문구와 버튼이 하나씩 나타납니다.
  - 위로 올리면 모든 것이 거꾸로 되돌아갑니다.
  - 제품·과자 이미지는 아래 스크립트의 DEFAULTS.base 주소에서 불러옵니다. (이 파일은 build-widget.py 로 만들어집니다)
  - 사용 위치: 아임웹 "전체 폭 · 여백 0" 섹션 안의 코드 위젯
-->
<style>
  /* ================================================================
     모든 클래스/아이디는 oronp- 접두사로 충돌을 막습니다
     ================================================================ */

  /* 전체 영역: 높이가 곧 "스크롤 길이" (600vh = 화면 6개 분량) */
  #oronp-hero {
    --oronp-ink: #FFFFFF;               /* 오버레이 위 글자색 */
    --oronp-dark: #15181E;              /* 오버레이 / 버튼 글자색 */
    --oronp-grad: linear-gradient(90deg, #8FE3B0 0%, #F3E58A 52%, #F5A9C8 100%); /* 로고 그라데이션 */
    position: relative;
    width: 100%;
    height: 600vh;
    background: #FBFAF8;
  }

  /* 화면에 고정되는 무대 (스크롤 위치에 따라 JS가 클래스를 바꿈) */
  #oronp-hero .oronp-stage {
    position: absolute; top: 0; left: 0; right: 0;
    height: 100vh; height: 100svh;
    overflow: hidden;
    background: #FBFAF8;
  }
  #oronp-hero .oronp-stage.oronp-is-pinned { position: fixed; top: 0; bottom: auto; }    /* 히어로 구간: 화면에 고정 */
  #oronp-hero .oronp-stage.oronp-is-after  { position: absolute; top: auto; bottom: 0; }  /* 히어로 이후: 구간 끝에 붙음 */

  /* 색 띠와 제품이 그려지는 캔버스 */
  #oronp-hero .oronp-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

  /* 제품이 다 나온 뒤 깔리는 오버레이 (불투명도는 JS가 스크롤에 맞춰 조절) */
  #oronp-hero .oronp-overlay {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background: rgba(21, 24, 30, 0.62);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    opacity: 0; pointer-events: none;
  }

  /* ---------- 문구 영역 (가운데 정렬) ---------- */
  #oronp-hero .oronp-copy {
    position: absolute; z-index: 2; left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    padding: 0 6vw;
    text-align: center; color: var(--oronp-ink);
  }
  #oronp-hero .oronp-sub {            /* 소개 문장 */
    font-size: clamp(14px, 1.6vw, 24px);
    font-weight: 500; letter-spacing: -.01em; line-height: 1.5;
  }
  #oronp-hero .oronp-title { margin: 30px 0 56px; }   /* GOOD PRODUCTS. / NEW MARKET. */
  #oronp-hero .oronp-title-line {
    font-size: clamp(34px, 5.6vw, 92px);
    font-weight: 800; letter-spacing: -.025em; line-height: 1.06;
  }

  /* 하나씩 등장: 처음엔 숨김 → oronp-is-in 이 붙으면 나타남 */
  #oronp-hero .oronp-step {
    opacity: 0; transform: translate3d(0, 28px, 0);
    transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1);
    will-change: opacity, transform;
  }
  #oronp-hero .oronp-step.oronp-is-in { opacity: 1; transform: translate3d(0, 0, 0); }

  /* NEW MARKET. (밑줄 없음) */
  #oronp-hero .oronp-accent { position: relative; display: inline-block; }

  /* CONTACT 버튼 (어두운 오버레이 위라서 흰색 버튼) */
  #oronp-hero .oronp-btn {
    display: inline-block; position: relative;
    padding: 16px 40px; border-radius: 4px;
    background: #fff; color: var(--oronp-dark);
    font-size: 15px; font-weight: 700; letter-spacing: .08em; text-decoration: none;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  #oronp-hero .oronp-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.28); }

  /* ---------- 스크롤 안내 / 진행 바 ---------- */
  #oronp-hero .oronp-hint {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 2;
    color: #fff; font-size: 11px; font-weight: 600; line-height: 1; letter-spacing: .3em;
    transition: opacity .4s ease;
  }
  #oronp-hero .oronp-hint::after {
    content: ""; display: block; width: 1px; height: 34px; margin: 10px auto 0;
    background: #fff; opacity: .6; transform-origin: top;
    animation: oronp-hero-drip 1.6s ease-in-out infinite;
  }
  @keyframes oronp-hero-drip { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

  /* ---------- 모바일(세로 화면) ---------- */
  @media (max-width: 820px) {
    #oronp-hero .oronp-title { margin: 20px 0 38px; }
    #oronp-hero .oronp-title-line { font-size: clamp(30px, 9.5vw, 52px); }
    #oronp-hero .oronp-btn { padding: 14px 32px; }
  }

  /* 사용자가 "동작 줄이기"를 켠 경우: 완성된 장면 + 문구 모두 표시 */
  @media (prefers-reduced-motion: reduce) {
    #oronp-hero { height: 100svh; }
    #oronp-hero .oronp-step { opacity: 1; transform: none; transition: none; }
    #oronp-hero .oronp-hint { display: none; }
  }
</style>

<script>
(function () {
  'use strict';

  // ===== 설정 (여기만 바꾸면 됩니다) =====
  var DEFAULTS = {
    base: 'https://cdn.jsdelivr.net/gh/webnova777/oron@b70951ea3cc04e0849fecf51ef42ce9576110198/hero-products/assets/',      // 제품 이미지 폴더 주소(끝에 / 포함)
    videoEnd: 0.58,              // 스크롤 진행도 0~이 값 사이에 제품이 차례로 올라옴
    overlay: [0.62, 0.70],       // 오버레이가 깔리는 구간 (시작, 끝)
    steps: [0.72, 0.79, 0.86, 0.93], // 문구 등장 시점: 소개문 → GOOD PRODUCTS. → NEW MARKET. → 버튼
    pullUp: 'auto'               // 'auto' = 히어로가 페이지 맨 위에 있으면 메뉴 높이만큼의 흰 여백을 자동으로 덮음 / 숫자(px) / 0 = 사용 안 함
  };
  var cfg = Object.assign({}, DEFAULTS, window.ORON_HERO_CONFIG || {});

  var root = document.getElementById('oronp-hero');
  if (!root || root.__oronInit) return;   // 같은 페이지에 두 번 들어가도 한 번만 실행
  root.__oronInit = true;

  var stage = root.querySelector('.oronp-stage');
  var canvas = root.querySelector('.oronp-canvas');
  var ctx = canvas.getContext('2d');
  var overlay = root.querySelector('.oronp-overlay');
  var hint = root.querySelector('.oronp-hint');
  var steps = Array.prototype.slice.call(root.querySelectorAll('.oronp-step')); // 등장 순서대로
  var accent = root.querySelector('.oronp-accent');

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var images = {};                 // 불러온 제품 이미지
  var target = 0, current = 0;     // 목표 시간(초) / 현재 시간(부드럽게 따라감)
  var lastDrawn = -1, progress = 0;

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  /*
   * ORON 히어로 · 제품 + 과자 마스크 리빌 합성 (캔버스)
   *
   * - 색 띠 3개(비스듬한 가로 띠)가 차례로 펼쳐지고,
   * - 띠마다 "패키지"가 자기 띠의 아래쪽 경계선 밖에서 올라와 드러나며(마스크 리빌, 아래쪽은 살짝 가려진 채 멈춤),
   * - 곧이어 반대쪽에 "과자 실물"이 뿅 하고 튀어나옵니다.
   * - 글자·오버레이는 넣지 않습니다. (영상 위에 HTML 로 따로 얹음)
   *
   * 사용: ORON_COMPOSE.render(ctx, images, t)   t = 0 ~ DURATION(초)
   *  - 캔버스 크기에 맞춰 레이아웃이 자동으로 정해집니다.
   *    · 가로 화면: 1920 x 1080 기준 좌표 (더 넓은 화면은 띠만 좌우로 늘어남)
   *    · 세로 화면(모바일): 폭 700 기준 좌표, 띠와 제품이 위아래로 배치됨
   */
  (function (root) {
    'use strict';

    var DURATION = 6.6;                         // 영상 길이(초)

    // ----- 색: 띠마다 [밝은 쪽, 진한 쪽] 두 톤으로 은은한 그라데이션 + 같은 계열의 한 톤 진한 글자색 -----
    var COLORS = {
      page: '#FBFAF8',                                   // 띠가 펼쳐지기 전의 바탕
      band1: { from: '#F9DAE4', to: '#F0BFD0', text: '#EEC0CF' },   // 위 띠: 핑크   (참깨 크런치볼 = 크래프트 봉지)
      band2: { from: '#DAF1E6', to: '#C2E5D4', text: '#BEE2CF' },   // 가운데 띠: 민트 (꿔바칩 = 노랑/빨강 봉지)
      band3: { from: '#CCE2F0', to: '#B1CFE4', text: '#AECCE1' }    // 아래 띠: 하늘 (바나나 초콜릿 = 노랑 봉지)
    };
    if (root.ORON_COLORS) for (var ck in root.ORON_COLORS) COLORS[ck] = root.ORON_COLORS[ck];   // 미리보기용: 띠 색 덮어쓰기

    // ----- 띠 위에 들어가는 영어 제품명 (위 띠부터) -----
    var NAMES = [['SESAME CRUNCH BALLS'], ['GUOBA CHIPS'], ['BANANA CHOCOLATE']];

    // ----- 등장 타이밍(초): [시작, 길이] -----
    var T = {
      yellowBag: [0.90, 1.30], redBag: [1.10, 1.30], chips:  [2.20, 0.65],     // 위 띠
      bananaBag: [2.60, 1.30], candy:  [3.70, 0.65],                            // 가운데 띠
      sesameBag: [4.30, 1.30], balls:  [5.40, 0.65]                             // 아래 띠
    };

    // ----- 레이아웃: 캔버스 비율에 따라 좌표계·띠 경계선·제품 위치를 정함 -----
    //  rise : 패키지. 자기 띠의 아래쪽 경계선(line) 위쪽에서만 보이며 아래에서 올라옴 (line=null 이면 화면 아래)
    //  pop  : 과자 실물. 마스크 없이 제자리에서 뿅 하고 커지며 나타남 (y = 중심 높이)
    function layout(cw, ch) {
      var L = {}, k = 0.15;                       // k: 경계선 기울기 (약 8.5°)
      if (cw / ch >= 1.15) {
        // 가로 화면: 16:9 보다 넓으면 높이 기준(1080), 좁으면 폭 기준(1920)으로 맞춤
        L.scale = (cw / ch >= 16 / 9) ? ch / 1080 : cw / 1920;
        L.vw = cw / L.scale; L.vh = ch / L.scale;
        var cx = L.vw / 2, vh = L.vh, yA = vh * 0.375, yB = vh * 0.685;
        L.slope = Math.atan(k);
        L.lineA = function (x) { return yA + k * (x - cx); };        // 위 경계: 오른쪽으로 내려감
        L.lineB = function (x) { return yB - k * (x - cx); };        // 아래 경계: 오른쪽으로 올라감
        L.names = [   // 제품명 글자: x = 글자 중심(가로), y = 경계선의 높이, dir = -1 선 바로 위 / +1 선 바로 아래, rot = 선과 같은 기울기, w = 글자 폭(px)
          { x: cx, y: L.lineA(cx), dir: -1, rot: L.slope, w: L.vw * 0.99 },
          { x: 40 + 665, y: L.lineB(40 + 665), dir: -1, rot: -L.slope, w: 1330 },
          { x: cx, y: L.lineB(cx), dir: 1, rot: -L.slope, w: L.vw * 0.99 }
        ];
        L.items = [
          // 위 띠: 참깨 크런치볼 봉지(오른쪽) + 과자 실물(왼쪽)
          { key: 'sesame',  kind: 'rise', t: T.yellowBag, x: cx + 430, h: 410, line: L.lineA, rot: L.slope + 0.02, hide: 0.16 },
          { key: 'balls',   kind: 'pop',  t: T.chips,     x: cx - 560, y: L.lineA(cx - 560) - 85, h: 215, rot: -0.05 },
          // 가운데 띠: 꿔바칩 봉지 2개(왼쪽) + 과자 실물(오른쪽)
          { key: 'guobaPair', kind: 'rise', t: T.bananaBag, x: cx - 390, h: 440, line: L.lineB, rot: -L.slope - 0.02, hide: 0.15 },
          { key: 'chips',   kind: 'pop',  t: T.candy,     x: cx + 565, y: L.lineB(cx + 565) - 55, h: 175, rot: 0.06 },
          // 아래 띠: 바나나 초콜릿 봉지(오른쪽) + 바나나 과자(왼쪽)
          { key: 'banana',  kind: 'rise', t: T.sesameBag, x: cx + 410, h: 430, line: null,    rot: 0.05,            hide: 0.16 },
          { key: 'candy',   kind: 'pop',  t: T.balls,     x: cx - 440, y: vh - 130, h: 160, rot: -0.06 }
        ];
      } else {
        // 세로 화면: 폭을 700 으로 보고, 높이는 비율대로
        L.scale = cw / 700; L.vw = 700; L.vh = ch / L.scale;
        var cx2 = 350, vh2 = L.vh;
        L.slope = Math.atan(k);
        L.lineA = function (x) { return vh2 * 0.34 + k * (x - cx2); };
        L.lineB = function (x) { return vh2 * 0.67 - k * (x - cx2); };
        L.names = [
          { x: cx2, y: L.lineA(cx2), dir: -1, rot: L.slope, w: 660, lines: ['SESAME', 'CRUNCH BALLS'] },
          { x: cx2, y: L.lineA(cx2), dir: 1, rot: L.slope, w: 660 },
          { x: cx2, y: L.lineB(cx2), dir: 1, rot: -L.slope, w: 660 }
        ];
        L.items = [
        { key: 'sesame',  kind: 'rise', t: T.yellowBag, x: cx2 + 48, h: Math.min(vh2 * 0.29, 400), line: L.lineA, rot: L.slope + 0.02, hide: 0.16 },
        { key: 'balls',   kind: 'pop',  t: T.chips,     x: cx2 - 235, y: L.lineA(cx2 - 235) - vh2 * 0.045, h: vh2 * 0.085, rot: -0.05 },
        { key: 'guobaPair', kind: 'rise', t: T.bananaBag, x: cx2 - 6, h: Math.min(vh2 * 0.27, 372), line: L.lineB, rot: -L.slope - 0.02, hide: 0.14 },
        { key: 'chips',   kind: 'pop',  t: T.candy,     x: cx2 + 200, y: L.lineA(cx2 + 200) + vh2 * 0.055, h: vh2 * 0.07, rot: 0.06 },
        { key: 'banana',  kind: 'rise', t: T.sesameBag, x: cx2 + 50, h: Math.min(vh2 * 0.26, 400), line: null,    rot: 0.05,            hide: 0.16 },
        { key: 'candy',   kind: 'pop',  t: T.balls,     x: cx2 - 215, y: vh2 - vh2 * 0.09, h: vh2 * 0.07, rot: -0.06 }
      ];
      }
      return L;
    }

    // ----- 이징 -----
    function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
    function easeOutQuart(p) { return 1 - Math.pow(1 - p, 4); }
    function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }
    function easeOutBack(p) { var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }  // 살짝 튀어 오르는 효과
    function seg(t, start, dur) { return clamp((t - start) / dur, 0, 1); }

    // ----- 띠 하나 그리기: 폴리곤 + 두 톤 그라데이션 + 부드러운 세로 빛줄기 + 아래로 떨어지는 그림자 -----
    function drawBand(g, L, band, top, bottom, reveal, fromRight) {
      if (reveal <= 0) return;
      var x0 = -300, x1 = L.vw + 300;
      g.save();
      // 좌→우(또는 우→좌)로 펼쳐지는 마스크
      var w = (L.vw + 600) * easeOutCubic(reveal);
      g.beginPath();
      if (fromRight) g.rect(x1 - w, -300, w + 1, L.vh + 600); else g.rect(x0, -300, w + 1, L.vh + 600);
      g.clip();
      g.beginPath();
      g.moveTo(x0, top(x0)); g.lineTo(x1, top(x1)); g.lineTo(x1, bottom(x1)); g.lineTo(x0, bottom(x0)); g.closePath();
      var cxm = L.vw / 2, yt = Math.max(top(cxm), 0), yb = Math.min(bottom(cxm), L.vh);
      var gr = g.createLinearGradient(0, yt, L.vw, yb);               // 왼쪽 위(밝음) → 오른쪽 아래(조금 진함)
      gr.addColorStop(0, band.from); gr.addColorStop(1, band.to);
      g.shadowColor = 'rgba(0,0,0,0.16)'; g.shadowBlur = 28 * L.scale; g.shadowOffsetY = 10 * L.scale;
      g.fillStyle = gr; g.fill();
      g.shadowColor = 'transparent'; g.clip();
      // 커튼처럼 은은하게 이어지는 세로 빛줄기
      var st = g.createLinearGradient(0, 0, L.vw, 0), pos = [0, 0.07, 0.15, 0.27, 0.36, 0.5, 0.61, 0.74, 0.85, 0.94, 1];
      for (var i = 0; i < pos.length; i++) st.addColorStop(pos[i], i % 2 ? 'rgba(255,255,255,0)' : 'rgba(255,255,255,0.20)');
      g.fillStyle = st; g.fillRect(x0, -300, x1 - x0, L.vh + 600);
      g.restore();
    }

    // ----- 영어 제품명: 띠 색보다 아주 살짝 진한 색. 띠의 경계선과 나란히 기울여 선 바로 위(dir=-1) 또는 바로 아래(dir=+1)에 붙임 -----
    function drawName(g, L, band, top, bottom, lines, cx, ay, dir, rot, width, reveal) {
      if (reveal <= 0) return;
      var fam = 'sans-serif';
      try { fam = getComputedStyle(g.canvas).fontFamily || fam; } catch (e) {}
      g.save();
      var x0 = -300, x1 = L.vw + 300;                                   // 자기 띠 안쪽에서만 보이도록 자름
      g.beginPath(); g.moveTo(x0, top(x0)); g.lineTo(x1, top(x1)); g.lineTo(x1, bottom(x1)); g.lineTo(x0, bottom(x0)); g.closePath(); g.clip();
      g.globalAlpha = clamp((reveal - 0.3) / 0.7, 0, 1);
      g.translate(cx, ay); g.rotate(rot);                               // (cx, ay) = 경계선 위의 점, 글자 밑줄이 선과 나란함
      var size = 100, widest = 0, gap = 12, cap;
      g.font = '900 ' + size + 'px ' + fam;
      lines.forEach(function (t) { widest = Math.max(widest, g.measureText(t).width); });
      size = size * width / widest;                                     // 가장 긴 줄의 폭이 width 가 되도록
      g.font = '900 ' + size + 'px ' + fam;
      cap = size * 0.72;
      g.fillStyle = band.text; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      lines.forEach(function (t, i) {
        var y = dir < 0 ? -gap - (lines.length - 1 - i) * size * 1.02 : gap + cap + i * size * 1.02;
        g.fillText(t, 0, y);
      });
      g.restore();
    }

    // ----- 패키지: 경계선 위쪽에서만 보이도록 잘라서(마스크) 아래에서 올려 줌 -----
    function drawRise(ctx, L, img, p) {
      var prog = easeOutQuart(seg(L.time, p.t[0], p.t[1]));
      if (prog <= 0) return;
      var h = p.h, w = img.width * h / img.height;
      var baseY = (p.line ? p.line(p.x) : L.vh) + p.hide * h;       // 최종 위치: 아래쪽 일부가 경계선 아래로 들어가 가려짐
      var rise = (1 - prog) * (h + 80);                              // 처음엔 경계선 아래에 완전히 숨어 있다가 올라옴
      ctx.save();
      ctx.beginPath();
      if (p.line) { ctx.moveTo(-300, -300); ctx.lineTo(L.vw + 300, -300); ctx.lineTo(L.vw + 300, p.line(L.vw + 300)); ctx.lineTo(-300, p.line(-300)); }
      else { ctx.rect(-300, -300, L.vw + 600, L.vh + 600); }
      ctx.closePath(); ctx.clip();
      ctx.translate(p.x, baseY + rise);
      ctx.rotate(p.rot);
      ctx.shadowColor = 'rgba(0,0,0,0.30)'; ctx.shadowBlur = 34 * L.scale; ctx.shadowOffsetY = 18 * L.scale;
      ctx.drawImage(img, -w / 2, -h, w, h);
      ctx.restore();
    }

    // ----- 과자 실물: 제자리에서 뿅! (작게 → 살짝 커졌다가 → 제 크기) -----
    function drawPop(ctx, L, img, p) {
      var prog = seg(L.time, p.t[0], p.t[1]);
      if (prog <= 0) return;
      var s = Math.max(0, easeOutBack(prog));
      var h = p.h, w = img.width * h / img.height;
      ctx.save();
      ctx.globalAlpha = clamp(prog * 5, 0, 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot + (1 - prog) * 0.5);                          // 돌면서 튀어나옴
      ctx.scale(s, s);
      ctx.shadowColor = 'rgba(0,0,0,0.30)'; ctx.shadowBlur = 26 * L.scale; ctx.shadowOffsetY = 12 * L.scale;
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();
    }

    function render(ctx, images, t) {
      var cv = ctx.canvas, L = layout(cv.width, cv.height);
      L.time = t;
      ctx.save();
      ctx.setTransform(L.scale, 0, 0, L.scale, 0, 0);
      ctx.shadowColor = 'transparent';

      // 바탕
      ctx.fillStyle = COLORS.page; ctx.fillRect(-300, -300, L.vw + 600, L.vh + 600);

      // 색 띠: 아래 띠부터 깔고, 위 띠가 위에 겹침 (경계마다 그림자)
      var r1 = seg(t, 0.00, 0.9), r2 = seg(t, 0.18, 0.9), r3 = seg(t, 0.36, 0.9);
      drawBand(ctx, L, COLORS.band3, L.lineB, function () { return L.vh + 300; }, r3, true);
      drawBand(ctx, L, COLORS.band2, L.lineA, L.lineB, r2, false);
      drawBand(ctx, L, COLORS.band1, function () { return -300; }, L.lineA, r1, true);

      // 영어 제품명 (띠 위, 제품 뒤)
      var N = L.names, up = function () { return -300; }, down = function () { return L.vh + 300; };
      drawName(ctx, L, COLORS.band1, up, L.lineA, N[0].lines || NAMES[0], N[0].x, N[0].y, N[0].dir, N[0].rot, N[0].w, r1);
      drawName(ctx, L, COLORS.band2, L.lineA, L.lineB, N[1].lines || NAMES[1], N[1].x, N[1].y, N[1].dir, N[1].rot, N[1].w, r2);
      drawName(ctx, L, COLORS.band3, L.lineB, down, N[2].lines || NAMES[2], N[2].x, N[2].y, N[2].dir, N[2].rot, N[2].w, r3);

      // 패키지와 과자: 배열 순서대로 겹쳐 그림
      L.items.forEach(function (p) {
        var img = images[p.key];
        if (!img) return;
        if (p.kind === 'rise') drawRise(ctx, L, img, p); else drawPop(ctx, L, img, p);
      });

      ctx.restore();
    }

    root.ORON_COMPOSE = { render: render, layout: layout, DURATION: DURATION, KEYS: ['guobaPair', 'chips', 'banana', 'candy', 'sesame', 'balls'] };
  })(typeof window !== 'undefined' ? window : this);

  var COMPOSE = window.ORON_COMPOSE;

  // ----- 제품 이미지 불러오기 (실패하면 최대 2번 다시 시도) -----
  var FILES = { guobaPair: 'guoba-pair.png', chips: 'chips.png', banana: 'banana.png', candy: 'banana-candy.png', sesame: 'sesame.png', balls: 'sesame-balls.png' };
  function loadImage(key, tries) {
    var img = new Image();
    img.onload = function () { images[key] = img; lastDrawn = -1; };
    img.onerror = function () { if (tries < 2) loadImage(key, tries + 1); };
    img.src = cfg.base + FILES[key] + (tries ? '?r=' + tries : '');
  }
  Object.keys(FILES).forEach(function (k) { loadImage(k, 0); });

  // ----- 캔버스 크기 -----
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = stage.getBoundingClientRect();
    var w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (w !== canvas.width || h !== canvas.height) { canvas.width = w; canvas.height = h; lastDrawn = -1; }
  }

  // ----- 스크롤 진행도 / 화면 고정(pin) / 오버레이 / 문구 등장 -----
  function update() {
    var r = root.getBoundingClientRect();
    var vh = window.innerHeight;
    progress = clamp(-r.top / Math.max(1, r.height - vh), 0, 1);   // 0(시작) ~ 1(끝)

    var state = r.top > 0 ? 'before' : (r.bottom < vh ? 'after' : 'pinned');
    stage.classList.toggle('oronp-is-pinned', state === 'pinned');
    stage.classList.toggle('oronp-is-after', state === 'after');

    target = clamp(progress / cfg.videoEnd, 0, 1) * COMPOSE.DURATION;   // 목표 시간(초)

    // 오버레이: 제품이 다 나온 뒤 서서히 깔림 (스크롤에 따라 정확히 되돌아감)
    overlay.style.opacity = clamp((progress - cfg.overlay[0]) / (cfg.overlay[1] - cfg.overlay[0]), 0, 1);

    // 문구: 기준을 넘으면 켜고, 되돌아오면 끔
    steps.forEach(function (el, i) {
      el.classList.toggle('oronp-is-in', progress >= cfg.steps[Math.min(i, cfg.steps.length - 1)]);
    });
    if (accent) accent.classList.toggle('oronp-is-in', progress >= cfg.steps[2]);
    hint.style.opacity = progress < 0.03 ? 1 : 0;
  }

  // ----- 매 프레임: 목표 시간을 향해 부드럽게 따라가며 그리기 -----
  function tick() {
    current += (target - current) * 0.2;
    if (Math.abs(target - current) < 0.002) current = target;
    var key = Math.round(current * 1000) + 'x' + canvas.width + 'x' + canvas.height;
    if (key !== lastDrawn) { COMPOSE.render(ctx, images, current); lastDrawn = key; }
    requestAnimationFrame(tick);
  }

  // ----- 상단 흰 띠 제거: 아임웹이 첫 섹션 위에 메뉴 높이만큼 남겨 둔 여백을 히어로가 덮도록 끌어올림 -----
  function pullUp() {
    var cur = parseFloat(root.style.marginTop) || 0;                     // 지금 적용된 값(음수)
    var top = root.getBoundingClientRect().top + window.scrollY - cur;   // 끌어올리기 전의 페이지 위쪽 거리
    var want = cfg.pullUp === 'auto' ? (top > 0 && top <= 120 ? top : 0) : (Number(cfg.pullUp) || 0);
    root.style.marginTop = want ? (-want + 'px') : '';
  }

  // ----- 시작 -----
  pullUp();
  window.addEventListener('load', function () { pullUp(); resize(); update(); });
  resize();
  window.addEventListener('resize', function () { pullUp(); resize(); update(); });

  if (reduce) {            // 동작 줄이기: 완성된 장면 + 오버레이 + 문구를 모두 표시
    target = current = COMPOSE.DURATION;
    overlay.style.opacity = 1;
    steps.forEach(function (el) { el.classList.add('oronp-is-in'); });
    if (accent) accent.classList.add('oronp-is-in');
    var t = setInterval(function () { if (Object.keys(FILES).every(function (k) { return images[k]; })) { COMPOSE.render(ctx, images, COMPOSE.DURATION); clearInterval(t); } }, 120);
    return;
  }

  window.addEventListener('scroll', update, { passive: true });
  update();
  requestAnimationFrame(tick);
})();
</script>
